# 本地构建版：和 docker-compose.yml 同一个服务，只是镜像自己 build，不从 GHCR 拉。
#
#   ./scripts/build-web.sh                                          # 先出 web 产物
#   docker compose -f deploy/docker-compose.build.yml up -d --build
#
# **顺序别反**：deploy/Dockerfile 只是 COPY app/build/web/，没跑过 build-web.sh
# 的话镜像照样能构建出来（仓库里有 .gitkeep 占位），但打开首页看到的是「还没构建
# 前端」的说明页，而不是看板。机器上没装 Flutter 就把下面 dockerfile 换成
# Dockerfile.full，让第一阶段在容器里构建（首次拉 SDK 数 GB，十几分钟）。
#
# 端口同样用高位：家宽封 80/443/8080，**别把端口配回去**。

# 项目名钉成 famledger：compose 默认拿**文件所在目录名**当项目名，这个文件在
# deploy/ 下，不钉的话卷会叫 deploy_fldata、网络叫 deploy_default —— 换个目录
# 名就等于换了一份数据，升级时最容易踩的坑。
name: famledger

services:
  famledger:
    build:
      # context 相对本文件所在目录 → 仓库根。镜像要 server/ 和 app/build/web/，
      # 根目录的 .dockerignore 负责把 .git、.superpowers、app/build 的其余部分挡在外面。
      context: ..
      dockerfile: deploy/Dockerfile
      # 没装 Flutter 的机器改用这个（多阶段，第一阶段自带 Flutter 3.32.1 构建 web）：
      # dockerfile: deploy/Dockerfile.full
    image: famledger:local
    container_name: famledger
    restart: unless-stopped
    ports:
      - "${FL_PORT:-48090}:48090"
    volumes:
      # 同 docker-compose.yml：不设就是命名卷 fldata；设成绝对路径则是 bind mount，
      # 那种情况要先 `chown -R 1000:1000` 宿主目录（容器内以 UID 1000 的 node 跑）。
      - "${FL_DATA_PATH:-fldata}:/data"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # 本地构建常常是直接在局域网里访问（没有反代），那就设 0；挂到 CF Tunnel
      # 后面再改回 1。镜像里的默认值是 1。
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      SETUP_TOKEN: "${SETUP_TOKEN:-}"
      SETUP_PER_MIN: "${SETUP_PER_MIN:-5}"
      LOGIN_PER_MIN: "${LOGIN_PER_MIN:-10}"
      # AI 限流（账单保护）：每人每分钟的 AI 请求数（按成员分桶），
      # 以及同时在跑的上游流条数。超了分别是 429 rate_limited / 503 ai_busy。
      AI_PER_MIN: "${AI_PER_MIN:-30}"
      AI_MAX_STREAMS: "${AI_MAX_STREAMS:-4}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # CORS_ORIGINS: "${CORS_ORIGINS:-}"

volumes:
  fldata:
